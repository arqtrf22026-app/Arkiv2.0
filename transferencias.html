<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKIV - Transferências</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex h-screen overflow-hidden transition-colors duration-200">

    <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-all duration-300">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-700">
            <i data-lucide="box" class="h-8 w-8 text-blue-600 mr-2"></i>
            <span class="text-xl font-bold">ARKIV</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="index.html" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md">
                <i data-lucide="layout-dashboard" class="h-5 w-5 mr-3"></i> Dashboard
            </a>
            <a href="caixas.html" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md">
                <i data-lucide="archive" class="h-5 w-5 mr-3"></i> Caixas
            </a>
            <a href="documentos.html" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md">
                <i data-lucide="file-text" class="h-5 w-5 mr-3"></i> Acervo
            </a>
            <a href="transferencias.html" class="flex items-center px-3 py-2 bg-blue-50 dark:bg-blue-900/50 text-blue-700 dark:text-blue-400 rounded-md">
                <i data-lucide="arrow-right-left" class="h-5 w-5 mr-3"></i> Transferências
            </a>
            <a href="solicitacoes.html" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md">
                <i data-lucide="send" class="h-5 w-5 mr-3"></i> Solicitações
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white/80 dark:bg-gray-800/80 backdrop-blur border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 z-10">
            <button id="btn-toggle-sidebar" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300"><i data-lucide="menu"></i></button>
            <div class="flex items-center space-x-4">
                <button id="btn-theme" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300"><i data-lucide="moon" id="icon-theme"></i></button>
                <div class="h-8 w-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">A</div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <div class="mb-6 border-b border-gray-200 dark:border-gray-700 pb-4 flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4">
                <div>
                    <h1 class="text-3xl font-semibold text-gray-900 dark:text-white">Gerenciamento de Transferências</h1>
                    <p class="text-sm text-gray-500 mt-1">Analise e aprove o recebimento de documentos de outros setores.</p>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
                <div class="overflow-x-auto max-h-[65vh]">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 dark:bg-gray-700/50 sticky top-0 border-b border-gray-200 dark:border-gray-700 shadow-sm">
                            <tr>
                                <th class="px-4 py-3 font-medium text-gray-500 dark:text-gray-300">ID da Remessa</th>
                                <th class="px-4 py-3 font-medium text-gray-500 dark:text-gray-300">Status</th>
                                <th class="px-4 py-3 font-medium text-gray-500 dark:text-gray-300">Servidor</th>
                                <th class="px-4 py-3 font-medium text-gray-500 dark:text-gray-300">Setor Remetente</th>
                                <th class="px-4 py-3 font-medium text-gray-500 dark:text-gray-300">Data</th>
                                <th class="px-4 py-3 font-medium text-gray-500 dark:text-gray-300 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-transferencias" class="divide-y divide-gray-200 dark:divide-gray-700">
                            <!-- Injetado via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="transferencias.js"></script>
</body>
</html>
